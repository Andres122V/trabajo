<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Perros y Gatos</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@2.0.0/dist/tf.min.js"></script>

  <style>
    #resultado {
      font-weight: bold;
      font-size: 3rem;
      text-align: center;
    }
  </style>
</head>

<body>

<div class="container text-center mt-4">
  <h1>Perros y Gatos 🐶🐱</h1>
  <!-- 🔥 BOTONES DE NAVEGACIÓN (AQUÍ VA) -->
    <div class="mt-3">
        
        <a href="../index.html" class="btn btn-dark">
            🏠 Inicio
        </a>

        <a href="../emociones/index.html" class="btn btn-success">
            🐱 Emoiones
        </a>

  <video id="video" autoplay playsinline style="display:none;"></video>
  <canvas id="canvas" width="400" height="400"></canvas>
  <canvas id="otrocanvas" width="100" height="100" style="display:none;"></canvas>

  <br>
  <button class="btn btn-primary mt-2" onclick="cambiarCamara()">Cambiar cámara</button>

  <div id="resultado" class="mt-3"></div>
</div>

<script>
let tamano = 400;
let video = document.getElementById("video");
let canvas = document.getElementById("canvas");
let otrocanvas = document.getElementById("otrocanvas");
let ctx = canvas.getContext("2d");

let modelo = null;
let currentStream = null;
let facingMode = "user";

// 🔥 Cargar modelo correctamente
async function cargarModelo() {
  console.log("Cargando modelo...");
  modelo = await tf.loadLayersModel("./model.json");
  console.log("Modelo cargado");
}

// 🎥 Iniciar cámara
function mostrarCamara() {
  navigator.mediaDevices.getUserMedia({
    audio: false,
    video: { width: tamano, height: tamano, facingMode }
  })
  .then(stream => {
    currentStream = stream;
    video.srcObject = stream;
    procesarCamara();
    predecir();
  })
  .catch(err => {
    console.error(err);
    alert("Error al acceder a la cámara");
  });
}

// 🔄 Cambiar cámara
function cambiarCamara() {
  if (currentStream) {
    currentStream.getTracks().forEach(track => track.stop());
  }

  facingMode = facingMode === "user" ? "environment" : "user";
  mostrarCamara();
}

// 🎨 Dibujar frame
function procesarCamara() {
  ctx.drawImage(video, 0, 0, tamano, tamano);
  requestAnimationFrame(procesarCamara);
}

// 🧠 Predicción
function predecir() {

  if (!modelo) {
    setTimeout(predecir, 200);
    return;
  }

  resample_single(canvas, 100, 100, otrocanvas);

  let ctx2 = otrocanvas.getContext("2d");
  let imgData = ctx2.getImageData(0, 0, 100, 100);

  let arr = [];
  let fila = [];

  for (let i = 0; i < imgData.data.length; i += 4) {
    let r = imgData.data[i] / 255;
    let g = imgData.data[i + 1] / 255;
    let b = imgData.data[i + 2] / 255;

    let gris = (r + g + b) / 3;

    fila.push([gris]);

    if (fila.length === 100) {
      arr.push(fila);
      fila = [];
    }
  }

  let tensor = tf.tensor4d([arr]);

  let resultado = modelo.predict(tensor).dataSync()[0]; // ✅ FIX CLAVE

  console.log("Predicción:", resultado);

  let respuesta = resultado <= 0.5 ? "🐱 Gato" : "🐶 Perro";
  document.getElementById("resultado").innerText = respuesta;

  setTimeout(predecir, 150);
}

// 🔽 Resize
function resample_single(canvas, width, height, resize_canvas) {
  let ctx = canvas.getContext("2d");
  let ctx2 = resize_canvas.getContext("2d");

  ctx2.drawImage(canvas, 0, 0, width, height);
}

// 🚀 INIT
window.onload = async () => {
  await cargarModelo();
  mostrarCamara();
};
</script>

</body>
</html>
