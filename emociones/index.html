<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Detector de Emociones PRO 😊</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.17.0/dist/tf.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/face-api.js"></script>

<style>
body{
    background:#f5f5f5;
}

#resultado{
    font-weight:bold;
    font-size:2.5rem;
    text-align:center;
    margin-top:20px;
}

#confianza{
    font-size:1.3rem;
    text-align:center;
}

canvas{
    border-radius:10px;
}
</style>

</head>

<body>

<div class="container text-center mt-4">

    <h1>Detector de Emociones 😊2</h1>

    <!-- NAV -->
    <div class="mt-3 mb-3">

        <a href="../index.html" class="btn btn-dark">🏠 Inicio</a>
        <a href="../gato y perro/index.html" class="btn btn-success">🐶🐱 Gatos y Perros</a>

    </div>

    <video id="video" autoplay playsinline style="display:none;"></video>

    <canvas id="canvas" width="400" height="400"></canvas>

    <canvas id="otrocanvas" width="48" height="48" style="display:none;"></canvas>

    <br>

    <button class="btn btn-primary mt-3" onclick="cambiarCamara()">
        Cambiar cámara
    </button>

    <div id="resultado"></div>
    <div id="confianza"></div>

</div>

<script>

let tamano = 400;

let video = document.getElementById("video");
let canvas = document.getElementById("canvas");
let otrocanvas = document.getElementById("otrocanvas");

let ctx = canvas.getContext("2d");

let modelo = null;
let currentStream = null;
let facingMode = "user";

const emociones = [
    "😠 Angry",
    "😨 Fear",
    "😊 Happy",
    "😢 Sad",
    "😲 Surprise"
];

// ================= MODELO IA =================
async function cargarModelo(){
    modelo = await tf.loadLayersModel("./model.json");
}

// ================= CAMARA =================
function mostrarCamara(){

    navigator.mediaDevices.getUserMedia({
        video:{
            width:tamano,
            height:tamano,
            facingMode:facingMode
        }
    })
    .then(stream=>{
        currentStream = stream;
        video.srcObject = stream;
    })
    .catch(err=>{
        alert("No se pudo acceder a la cámara");
        console.error(err);
    });
}

function cambiarCamara(){

    if(currentStream){
        currentStream.getTracks().forEach(track=>track.stop());
    }

    facingMode = facingMode === "user" ? "environment" : "user";

    mostrarCamara();
}

// ================= PREDICCIÓN =================
async function predecir(){

    if(!modelo){
        setTimeout(predecir,200);
        return;
    }

    // DETECTAR ROSTRO
    const deteccion = await faceapi.detectSingleFace(
        video,
        new faceapi.TinyFaceDetectorOptions()
    );

    if(!deteccion){
        document.getElementById("resultado").innerText = "No face 😶";
        setTimeout(predecir,200);
        return;
    }

    let box = deteccion.box;

    // dibujar solo rostro
    ctx.drawImage(
        video,
        box.x,
        box.y,
        box.width,
        box.height,
        0,
        0,
        tamano,
        tamano
    );

    // redimensionar a 48x48
    let ctx2 = otrocanvas.getContext("2d");

    ctx2.drawImage(canvas,0,0,48,48);

    let imgData = ctx2.getImageData(0,0,48,48);

    let arr = [];
    let fila = [];

    for(let i=0;i<imgData.data.length;i+=4){

        let r = imgData.data[i]/255;
        let g = imgData.data[i+1]/255;
        let b = imgData.data[i+2]/255;

        let gris = (r+g+b)/3;

        fila.push([gris]);

        if(fila.length === 48){
            arr.push(fila);
            fila = [];
        }
    }

    let tensor = tf.tensor4d(arr,[1,48,48,1]);

    let predicciones = modelo.predict(tensor).dataSync();

    let indice = predicciones.indexOf(Math.max(...predicciones));

    let confianza = predicciones[indice]*100;

    document.getElementById("resultado").innerText = emociones[indice];

    document.getElementById("confianza").innerText =
        "Confianza: " + confianza.toFixed(2) + "%";

    tensor.dispose();

    setTimeout(predecir,200);
}

// ================= INICIO =================
window.onload = async()=>{

    await cargarModelo();

    await faceapi.nets.tinyFaceDetector.loadFromUri(
        "https://cdn.jsdelivr.net/npm/face-api.js/models"
    );

    mostrarCamara();
    predecir();
};

</script>

</body>
</html>
