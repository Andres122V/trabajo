<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Detector de Emociones 😊</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.17.0/dist/tf.min.js"></script>

<style>
body{
    background:#f5f5f5;
}

#resultado{
    font-weight:bold;
    font-size:2.5rem;
    text-align:center;
    margin-top:20px;
}

#confianza{
    font-size:1.3rem;
    text-align:center;
}

canvas{
    border-radius:10px;
}
</style>

</head>

<body>

<div class="container text-center mt-4">

    <h1>Detector de Emociones 😊</h1>

    <!-- 🔥 BOTONES -->
    <div class="mt-3 mb-3">

        <a href="../index.html" class="btn btn-dark">
            🏠 Inicio
        </a>

        <a href="../gato_y_perro/index.html" class="btn btn-success">
            🐶🐱 Ir a Gatos y Perros
        </a>

    </div>

    <video id="video" autoplay playsinline style="display:none;"></video>

    <canvas id="canvas" width="400" height="400"></canvas>

    <canvas id="otrocanvas" width="48" height="48" style="display:none;"></canvas>

    <br>

    <button class="btn btn-primary mt-3" onclick="cambiarCamara()">
        Cambiar cámara
    </button>

    <div id="resultado"></div>
    <div id="confianza"></div>

</div>

<script>

let tamano = 400;

let video = document.getElementById("video");
let canvas = document.getElementById("canvas");
let otrocanvas = document.getElementById("otrocanvas");

let ctx = canvas.getContext("2d");

let modelo = null;

let currentStream = null;

let facingMode = "user";

const emociones = [
    "😠 Angry",
    "😨 Fear",
    "😊 Happy",
    "😢 Sad",
    "😲 Surprise"
];

async function cargarModelo(){
    modelo = await tf.loadLayersModel("./model.json");
}

function mostrarCamara(){

    navigator.mediaDevices.getUserMedia({
        video:{
            width:tamano,
            height:tamano,
            facingMode:facingMode
        }
    })
    .then(stream=>{
        currentStream = stream;
        video.srcObject = stream;
        procesarCamara();
        predecir();
    })
    .catch(err=>{
        alert("No se pudo acceder a la cámara");
        console.error(err);
    });
}

function cambiarCamara(){

    if(currentStream){
        currentStream.getTracks().forEach(track=>track.stop());
    }

    facingMode = facingMode === "user" ? "environment" : "user";

    mostrarCamara();
}

function procesarCamara(){

    ctx.drawImage(video,0,0,tamano,tamano);
    requestAnimationFrame(procesarCamara);
}

function predecir(){

    if(!modelo){
        setTimeout(predecir,200);
        return;
    }

    resample_single(canvas,48,48,otrocanvas);

    let ctx2 = otrocanvas.getContext("2d");

    let imgData = ctx2.getImageData(0,0,48,48);

    let arr = [];
    let fila = [];

    for(let i=0;i<imgData.data.length;i+=4){

        let r = imgData.data[i]/255;
        let g = imgData.data[i+1]/255;
        let b = imgData.data[i+2]/255;

        let gris = (r+g+b)/3;

        fila.push([gris]);

        if(fila.length === 48){
            arr.push(fila);
            fila = [];
        }
    }

    // 🔥 FIX IMPORTANTE
    let tensor = tf.tensor4d(arr, [1,48,48,1]);

    let predicciones = modelo.predict(tensor).dataSync();

    let indice = predicciones.indexOf(Math.max(...predicciones));

    let confianza = predicciones[indice]*100;

    document.getElementById("resultado").innerText = emociones[indice];

    document.getElementById("confianza").innerText =
        "Confianza: " + confianza.toFixed(2) + "%";

    tensor.dispose();

    setTimeout(predecir,200);
}

function resample_single(canvas,width,height,resize_canvas){

    let ctx2 = resize_canvas.getContext("2d");

    ctx2.drawImage(canvas,0,0,width,height);
}

window.onload = async()=>{
    await cargarModelo();
    mostrarCamara();
};

</script>

</body>
</html>
